<!-- ==========================================================================
     COMPONENT: Header / Navigation
     Warm Huru-style Navigation with Brand Anchor & Actions
     ========================================================================== -->
<header class="sticky top-0 z-50 bg-[#FAF6EE]/90 backdrop-blur-md border-b border-[#E8DFD0]/70 h-20 transition-all">
  <div class="max-w-7xl mx-auto h-full px-6 flex items-center justify-between">
    <!-- Brand Anchor ONLY (clean & bold) -->
    <div class="flex items-center">
      <a class="text-2xl font-black tracking-tight text-[#2C1F0E] flex items-center gap-1.5" href="#">
        <span>IMAIRA<span class="text-[#AA7000]">+</span></span>
      </a>
    </div>

    <!-- Navigation & Actions on the Right -->
    <div class="flex items-center gap-7">
      <!-- Nav Links -->
      <nav class="hidden lg:flex items-center gap-7">
        <a class="text-sm font-semibold text-[#2C1F0E] hover:text-[#AA7000] transition-colors" href="#practice">Practice</a>
        <a class="text-sm font-semibold text-[#8C7B6B] hover:text-[#AA7000] transition-colors" href="#feedback">Feedback</a>
        <a class="text-sm font-semibold text-[#8C7B6B] hover:text-[#AA7000] transition-colors" href="#organisation">Organisation</a>
        <a class="text-sm font-semibold text-[#8C7B6B] hover:text-[#AA7000] transition-colors" href="#blog">Blog</a>
      </nav>

      <!-- Language selector -->
      <div class="hidden sm:flex items-center gap-1.5 text-sm font-semibold text-[#8C7B6B] hover:text-[#2C1F0E] transition-colors cursor-pointer">
        <span class="material-symbols-outlined text-[18px] text-[#7F766C]" data-icon="language">language</span>
        <span>EN</span>
        <span class="material-symbols-outlined text-[16px] text-[#7F766C]" data-icon="expand_more">expand_more</span>
      </div>

      <!-- Log in -->
      <a class="text-sm font-semibold text-[#2C1F0E] hover:text-[#AA7000] transition-colors" href="#login">Log in</a>

      <!-- Try now primary coral button -->
      <button class="bg-[#AA7000] hover:bg-[#917247] text-white px-5 py-2.5 rounded-full text-sm font-bold shadow-pill hover:shadow-lg transition-all flex items-center gap-1.5">
        <span>Try now</span>
        <span class="material-symbols-outlined text-[16px]" data-icon="arrow_forward">arrow_forward</span>
      </button>
    </div>
  </div>
</header>
